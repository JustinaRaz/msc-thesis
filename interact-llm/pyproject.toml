[project]
name = "interact_llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MinaAlmasi" }
]
requires-python = ">=3.12.3"
dependencies = [
    "accelerate>=1.3.0",
    "huggingface-hub>=0.28.1",
    "lingua-language-detector>=2.0.2",
    "protobuf>=5.29.3",
    "pydantic>=2.10.6",
    "sentencepiece>=0.2.0",
    "textual>=1.0.0",
    "toml>=0.10.2",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
    "transformers>=4.48.2",
    "pillow>=11.1.0",
    "torchvision>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.9.7",
]

[tool.ruff]
src = ["src"]
lint.select = ["F", "E", "W", "I001"] # F for pyflakes, E + W for pycodestyle errors + warnings, #I001 for isort

[tool.uv.sources]
transformers = { git = "https://github.com/huggingface/transformers", rev = "v4.49.0-Gemma-3" }

[tool.setuptools]
packages = ["interact_llm"]

